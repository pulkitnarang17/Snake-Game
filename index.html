<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C++ WebAssembly Snake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 26px;
      letter-spacing: 1px;
    }
    #stats {
      font-size: 18px;
      margin-bottom: 15px;
      color: #38bdf8;
      font-weight: 600;
    }
    canvas {
      border: 3px solid #334155;
      border-radius: 10px;
      background: #020617;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    #msg {
      margin-top: 15px;
      font-weight: 600;
      color: #94a3b8;
      height: 24px;
    }
  </style>
</head>
<body>

  <h1>C++ WebAssembly Snake</h1>
  <div id="stats">Score: <span id="score">0</span></div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div id="msg">Loading C++ Engine...</div>

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { 
      (window.vaq = window.vaq || []).push(arguments); 
    };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <!-- Emscripten generated JS file -->
  <script src="snake.js"></script>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const msgEl = document.getElementById("msg");

    const CELL_SIZE = 20;

    let wasm;
    let initGame, setDirection, updateGame;
    let getHeadX, getHeadY, getFruitX, getFruitY;
    let getScore, isGameOver, getBodyLength, getBodyX, getBodyY;

    // Load Wasm Module generated by Emscripten
    createSnakeModule().then((module) => {
      wasm = module;

      // Link JS functions to exported C++ functions
      initGame = wasm.cwrap('initGame', null, []);
      setDirection = wasm.cwrap('setDirection', null, ['number']);
      updateGame = wasm.cwrap('updateGame', null, []);
      getHeadX = wasm.cwrap('getHeadX', 'number', []);
      getHeadY = wasm.cwrap('getHeadY', 'number', []);
      getFruitX = wasm.cwrap('getFruitX', 'number', []);
      getFruitY = wasm.cwrap('getFruitY', 'number', []);
      getScore = wasm.cwrap('getScore', 'number', []);
      isGameOver = wasm.cwrap('isGameOver', 'number', []);
      getBodyLength = wasm.cwrap('getBodyLength', 'number', []);
      getBodyX = wasm.cwrap('getBodyX', 'number', ['number']);
      getBodyY = wasm.cwrap('getBodyY', 'number', ['number']);

      initGame();
      msgEl.innerText = "Use W / A / S / D or Arrow Keys to Move";

      // Run game loop at ~8 FPS (125ms per tick)
      setInterval(gameTick, 125);
    }).catch(err => {
      console.error(err);
      msgEl.innerText = "Failed to load C++ WebAssembly module.";
    });

    // Keyboard controls
    window.addEventListener("keydown", (e) => {
      if (!setDirection) return;
      const key = e.key.toLowerCase();
      if (key === 'w' || key === 'arrowup') setDirection(1);       // UP
      else if (key === 's' || key === 'arrowdown') setDirection(2); // DOWN
      else if (key === 'a' || key === 'arrowleft') setDirection(3);  // LEFT
      else if (key === 'd' || key === 'arrowright') setDirection(4); // RIGHT
      else if (key === 'r') initGame();
    });

    function gameTick() {
      // 1. Advance C++ physics & logic
      updateGame();

      const score = getScore();
      const over = isGameOver();
      scoreEl.innerText = score;

      if (over) {
        msgEl.innerText = "Game Over! Press 'R' to Restart";
        msgEl.style.color = "#f43f5e";
      } else {
        msgEl.innerText = "Use W / A / S / D or Arrow Keys";
        msgEl.style.color = "#94a3b8";
      }

      // 2. Clear canvas
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 3. Draw Fruit (Red circle)
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(
        getFruitX() * CELL_SIZE + CELL_SIZE / 2,
        getFruitY() * CELL_SIZE + CELL_SIZE / 2,
        CELL_SIZE / 2.3, 0, Math.PI * 2
      );
      ctx.fill();

      // 4. Draw Snake Body (Green)
      ctx.fillStyle = "#22c55e";
      const bodyLen = getBodyLength();
      for (let i = 0; i < bodyLen; ++i) {
        ctx.fillRect(
          getBodyX(i) * CELL_SIZE + 1,
          getBodyY(i) * CELL_SIZE + 1,
          CELL_SIZE - 2,
          CELL_SIZE - 2
        );
      }

      // 5. Draw Snake Head (Cyan)
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(
        getHeadX() * CELL_SIZE,
        getHeadY() * CELL_SIZE,
        CELL_SIZE,
        CELL_SIZE
      );
    }
  </script>
</body>
</html>

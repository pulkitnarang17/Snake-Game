<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake II — Nokia 3310</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="designSnakeGame.css">
</head>
<body>

  <main class="nokia-3310">
    <div class="earpiece" aria-hidden="true"></div>
    <div class="brand">NOKIA</div>

    <!-- Inner Silver Faceplate Bezel -->
    <div class="faceplate">
      <div class="screen-well">
        <div class="lcd-display">
          <header class="lcd-header">
            <span>HI:<span id="hi-score">0000</span></span>
            <span id="score">0000</span>
          </header>

          <canvas id="canvas" width="400" height="400" aria-label="Nokia Snake Game Screen"></canvas>

          <footer class="lcd-footer">
            <span id="msg">READY</span>
            <span aria-hidden="true">◄►▲▼</span>
          </footer>
        </div>
      </div>

      <!-- Navi Button cluster inside faceplate -->
      <div class="nav-cluster">
        <button type="button" class="navi-key" id="btn-navi">MENU / OK</button>
        <div class="soft-buttons">
          <button type="button" class="soft-btn" id="btn-reset">RESET</button>
          <button type="button" class="soft-btn" id="btn-c">C</button>
        </div>
      </div>
    </div>

    <!-- 12-Button Numeric Keypad -->
    <nav class="keypad-grid" aria-label="Phone Keypad">
      <button type="button" class="key"><span class="num">1</span><span class="sub">--</span></button>
      <button type="button" class="key key-dir" id="key-up"><span class="num">2</span><span class="sub">▲ UP</span></button>
      <button type="button" class="key"><span class="num">3</span><span class="sub">DEF</span></button>

      <button type="button" class="key key-dir" id="key-left"><span class="num">4</span><span class="sub">◀ LEFT</span></button>
      <button type="button" class="key" id="key-ok"><span class="num">5</span><span class="sub">PLAY</span></button>
      <button type="button" class="key key-dir" id="key-right"><span class="num">6</span><span class="sub">RIGHT ▶</span></button>

      <button type="button" class="key"><span class="num">7</span><span class="sub">PQRS</span></button>
      <button type="button" class="key key-dir" id="key-down"><span class="num">8</span><span class="sub">▼ DOWN</span></button>
      <button type="button" class="key"><span class="num">9</span><span class="sub">WXYZ</span></button>

      <button type="button" class="key"><span class="num">*</span><span class="sub">+</span></button>
      <button type="button" class="key"><span class="num">0</span><span class="sub">␣</span></button>
      <button type="button" class="key"><span class="num">#</span><span class="sub">⇧</span></button>
    </nav>

    <div class="mic-hole" aria-hidden="true"></div>
  </main>

  <!-- Wasm & Engine Scripts -->
  <script src="snake.js"></script>
  <script src="gameLogic.js"></script>
</body>
</html>

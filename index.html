<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>C++ WebAssembly Snake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow: hidden;
    }
    h1 {
      font-size: clamp(20px, 4vw, 26px);
      margin-bottom: 4px;
      letter-spacing: 1px;
    }
    #stats {
      font-size: clamp(15px, 3.5vw, 18px);
      margin-bottom: 8px;
      color: #38bdf8;
      font-weight: 600;
    }
    #canvas-container {
      width: min(90vw, 380px);
      height: min(90vw, 380px);
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      border: 3px solid #334155;
      border-radius: 12px;
      background: #020617;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      display: block;
    }
    #msg {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      height: 20px;
      text-align: center;
    }

    /* Mobile Virtual D-Pad */
    .controls {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 48px);
      gap: 6px;
      justify-content: center;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      cursor: pointer;
      transition: background 0.1s;
    }
    .btn:active {
      background: #38bdf8;
      color: #0f172a;
    }
    .btn-up    { grid-column: 2; grid-row: 1; }
    .btn-left  { grid-column: 1; grid-row: 2; }
    .btn-down  { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
    .btn-reset { 
      grid-column: 1 / span 3; 
      grid-row: 3; 
      font-size: 13px; 
      background: #334155; 
      height: 38px;
    }

    /* Hide D-Pad on large desktop screens if desired, or keep for testing */
    @media (min-height: 700px) and (min-width: 600px) {
      .controls {
        margin-top: 18px;
      }
    }
  </style>
</head>
<body>

  <h1>C++ WebAssembly Snake</h1>
  <div id="stats">Score: <span id="score">0</span></div>
  
  <div id="canvas-container">
    <canvas id="canvas" width="400" height="400"></canvas>
  </div>
  
  <div id="msg">Loading C++ Engine...</div>

  <!-- Mobile On-Screen Controls -->
  <div class="controls">
    <button class="btn btn-up" ontouchstart="handleMove(1)" onclick="handleMove(1)">▲</button>
    <button class="btn btn-left" ontouchstart="handleMove(3)" onclick="handleMove(3)">◀</button>
    <button class="btn btn-down" ontouchstart="handleMove(2)" onclick="handleMove(2)">▼</button>
    <button class="btn btn-right" ontouchstart="handleMove(4)" onclick="handleMove(4)">▶</button>
    <button class="btn btn-reset" ontouchstart="handleReset()" onclick="handleReset()">RESTART</button>
  </div>

  <script src="snake.js"></script>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const msgEl = document.getElementById("msg");

    const CELL_SIZE = 20;

    let wasm;
    let initGame, setDirection, updateGame;
    let getHeadX, getHeadY, getFruitX, getFruitY;
    let getScore, isGameOver, getBodyLength, getBodyX, getBodyY;

    // Load C++ Wasm module
    createSnakeModule().then((module) => {
      wasm = module;

      initGame = wasm.cwrap('initGame', null, []);
      setDirection = wasm.cwrap('setDirection', null, ['number']);
      updateGame = wasm.cwrap('updateGame', null, []);
      getHeadX = wasm.cwrap('getHeadX', 'number', []);
      getHeadY = wasm.cwrap('getHeadY', 'number', []);
      getFruitX = wasm.cwrap('getFruitX', 'number', []);
      getFruitY = wasm.cwrap('getFruitY', 'number', []);
      getScore = wasm.cwrap('getScore', 'number', []);
      isGameOver = wasm.cwrap('isGameOver', 'number', []);
      getBodyLength = wasm.cwrap('getBodyLength', 'number', []);
      getBodyX = wasm.cwrap('getBodyX', 'number', ['number']);
      getBodyY = wasm.cwrap('getBodyY', 'number', ['number']);

      initGame();
      msgEl.innerText = "Swipe, use D-pad, or W/A/S/D";

      setInterval(gameTick, 125);
    }).catch(err => {
      console.error(err);
      msgEl.innerText = "Failed to load C++ engine.";
    });

    // Helper functions for inputs
    function handleMove(dir) {
      if (setDirection) setDirection(dir);
    }

    function handleReset() {
      if (initGame) initGame();
    }

    // Keyboard controls (Desktop)
    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (key === 'w' || key === 'arrowup') handleMove(1);
      else if (key === 's' || key === 'arrowdown') handleMove(2);
      else if (key === 'a' || key === 'arrowleft') handleMove(3);
      else if (key === 'd' || key === 'arrowright') handleMove(4);
      else if (key === 'r') handleReset();
    });

    // Touch Swipe Controls (Mobile)
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    window.addEventListener("touchend", (e) => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;
      const absX = Math.abs(diffX);
      const absY = Math.abs(diffY);

      // Minimum swipe distance threshold (30px)
      if (Math.max(absX, absY) > 30) {
        if (absX > absY) {
          handleMove(diffX > 0 ? 4 : 3); // Right : Left
        } else {
          handleMove(diffY > 0 ? 2 : 1); // Down : Up
        }
      }
    }, { passive: true });

    function gameTick() {
      updateGame();

      const score = getScore();
      const over = isGameOver();
      scoreEl.innerText = score;

      if (over) {
        msgEl.innerText = "Game Over! Tap RESTART or press 'R'";
        msgEl.style.color = "#f43f5e";
      } else {
        msgEl.innerText = "Swipe screen or use buttons";
        msgEl.style.color = "#94a3b8";
      }

      // Render
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Fruit
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(
        getFruitX() * CELL_SIZE + CELL_SIZE / 2,
        getFruitY() * CELL_SIZE + CELL_SIZE / 2,
        CELL_SIZE / 2.3, 0, Math.PI * 2
      );
      ctx.fill();

      // Snake Body
      ctx.fillStyle = "#22c55e";
      const bodyLen = getBodyLength();
      for (let i = 0; i < bodyLen; ++i) {
        ctx.fillRect(
          getBodyX(i) * CELL_SIZE + 1,
          getBodyY(i) * CELL_SIZE + 1,
          CELL_SIZE - 2,
          CELL_SIZE - 2
        );
      }

      // Snake Head
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(
        getHeadX() * CELL_SIZE,
        getHeadY() * CELL_SIZE,
        CELL_SIZE,
        CELL_SIZE
      );
    }
  </script>
</body>
</html>

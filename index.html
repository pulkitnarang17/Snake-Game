<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake II — 3310 Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --lcd-bg: #97b538;
      --lcd-pixel: #162607;
      --phone-body: #1e3a5f;
      --phone-trim: #c4c9d0;
      --btn-color: #314455;
      --btn-label: #e2e8f0;
      --font-retro: 'VT323', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: #11141a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-retro);
      padding: 10px;
    }

    /* Outer Phone Shell (Nokia 3310 Silhouette) */
    .phone-body {
      background: var(--phone-body);
      border: 4px solid #0f1c2d;
      border-radius: 42px 42px 55px 55px;
      padding: 24px 20px 28px;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(255, 255, 255, 0.2);
    }

    .speaker-grill {
      width: 48px;
      height: 6px;
      background: #0f1c2d;
      border-radius: 3px;
      margin-bottom: 12px;
    }

    .brand-logo {
      color: var(--phone-trim);
      font-family: sans-serif;
      font-weight: 800;
      letter-spacing: 4px;
      font-size: 13px;
      margin-bottom: 12px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    /* Nokia Monochrome Screen Bezel */
    .screen-bezel {
      background: #505c68;
      border: 3px solid #28333e;
      border-radius: 14px;
      padding: 10px;
      width: 100%;
      box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    /* Green Monochrome LCD Display */
    .lcd-screen {
      background: var(--lcd-bg);
      border: 2px solid #5d741d;
      border-radius: 4px;
      padding: 6px 8px;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
    }

    .lcd-header {
      display: flex;
      justify-content: space-between;
      color: var(--lcd-pixel);
      font-size: 20px;
      line-height: 1;
      margin-bottom: 4px;
      border-bottom: 2px dashed #7a942a;
      padding-bottom: 2px;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--lcd-bg);
      image-rendering: pixelated;
    }

    .lcd-footer {
      display: flex;
      justify-content: space-between;
      color: var(--lcd-pixel);
      font-size: 16px;
      margin-top: 4px;
      font-weight: bold;
    }

    /* Keypad Area */
    .keypad {
      width: 100%;
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .soft-keys {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      padding: 0 8px;
    }

    .btn-soft {
      background: #475a6c;
      color: var(--btn-label);
      border: none;
      border-radius: 8px;
      width: 60px;
      height: 26px;
      font-family: sans-serif;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #1e2832;
    }

    .btn-soft:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1e2832;
    }

    .grid-keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .key {
      background: var(--btn-color);
      color: var(--btn-label);
      border: 1px solid #1a2530;
      border-radius: 12px;
      height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #151f28;
      transition: transform 0.05s;
    }

    .key:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #151f28;
      background: #445c74;
    }

    .key .num {
      font-size: 20px;
      line-height: 1;
      font-weight: bold;
    }

    .key .sub {
      font-family: sans-serif;
      font-size: 8px;
      letter-spacing: 0.5px;
      opacity: 0.6;
    }

    .key-active-nav {
      background: #25394d;
      border-color: #4a6785;
    }
  </style>
</head>
<body>

  <div class="phone-body">
    <div class="speaker-grill"></div>
    <div class="brand-logo">NOKIA</div>

    <!-- Screen Section -->
    <div class="screen-bezel">
      <div class="lcd-screen">
        <div class="lcd-header">
          <span>SNAKE II</span>
          <span id="score">0000</span>
        </div>
        <canvas id="canvas" width="400" height="400"></canvas>
        <div class="lcd-footer">
          <span id="msg">READY</span>
          <span>◄►▲▼</span>
        </div>
      </div>
    </div>

    <!-- Classic Keypad Section -->
    <div class="keypad">
      <div class="soft-keys">
        <button class="btn-soft" onclick="resetGame()">RESET</button>
        <button class="btn-soft" onclick="resetGame()">PLAY</button>
      </div>

      <div class="grid-keys">
        <button class="key" onclick="noop()"><span class="num">1</span><span class="sub">--</span></button>
        <button class="key key-active-nav" onclick="sendDirection(1)"><span class="num">2</span><span class="sub">▲ UP</span></button>
        <button class="key" onclick="noop()"><span class="num">3</span><span class="sub">DEF</span></button>

        <button class="key key-active-nav" onclick="sendDirection(3)"><span class="num">4</span><span class="sub">◀ LEFT</span></button>
        <button class="key" onclick="resetGame()"><span class="num">5</span><span class="sub">OK</span></button>
        <button class="key key-active-nav" onclick="sendDirection(4)"><span class="num">6</span><span class="sub">RIGHT ▶</span></button>

        <button class="key" onclick="noop()"><span class="num">7</span><span class="sub">PQRS</span></button>
        <button class="key key-active-nav" onclick="sendDirection(2)"><span class="num">8</span><span class="sub">▼ DOWN</span></button>
        <button class="key" onclick="noop()"><span class="num">9</span><span class="sub">WXYZ</span></button>

        <button class="key" onclick="noop()"><span class="num">*</span><span class="sub">+</span></button>
        <button class="key" onclick="noop()"><span class="num">0</span><span class="sub">␣</span></button>
        <button class="key" onclick="noop()"><span class="num">#</span><span class="sub">⇧</span></button>
      </div>
    </div>
  </div>

  <script src="snake.js"></script>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const msgEl = document.getElementById("msg");

    const CELL_SIZE = 20;

    let wasm;
    let initGame, setDirection, updateGame;
    let getHeadX, getHeadY, getFruitX, getFruitY;
    let getScore, isGameOver, getBodyLength, getBodyX, getBodyY;

    // Load C++ WebAssembly Module
    createSnakeModule().then((module) => {
      wasm = module;

      initGame = wasm.cwrap('initGame', null, []);
      setDirection = wasm.cwrap('setDirection', null, ['number']);
      updateGame = wasm.cwrap('updateGame', null, []);
      getHeadX = wasm.cwrap('getHeadX', 'number', []);
      getHeadY = wasm.cwrap('getHeadY', 'number', []);
      getFruitX = wasm.cwrap('getFruitX', 'number', []);
      getFruitY = wasm.cwrap('getFruitY', 'number', []);
      getScore = wasm.cwrap('getScore', 'number', []);
      isGameOver = wasm.cwrap('isGameOver', 'number', []);
      getBodyLength = wasm.cwrap('getBodyLength', 'number', []);
      getBodyX = wasm.cwrap('getBodyX', 'number', ['number']);
      getBodyY = wasm.cwrap('getBodyY', 'number', ['number']);

      initGame();
      msgEl.innerText = "RUNNING";
      setInterval(gameTick, 130);
    }).catch(err => {
      console.error(err);
      msgEl.innerText = "ERR";
    });

    function sendDirection(dir) {
      if (setDirection) setDirection(dir);
    }

    function resetGame() {
      if (initGame) {
        initGame();
        msgEl.innerText = "RUNNING";
      }
    }

    function noop() {}

    // Keypad Support: Supports both WASD/Arrows AND Numpad 2/4/6/8
    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup' || k === '2') sendDirection(1);
      else if (k === 's' || k === 'arrowdown' || k === '8') sendDirection(2);
      else if (k === 'a' || k === 'arrowleft' || k === '4') sendDirection(3);
      else if (k === 'd' || k === 'arrowright' || k === '6') sendDirection(4);
      else if (k === 'r' || k === '5' || k === 'enter') resetGame();
    });

    // Touch Swipe gestures right on LCD screen
    let touchX = 0, touchY = 0;
    canvas.addEventListener("touchstart", (e) => {
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > 20) sendDirection(dx > 0 ? 4 : 3);
      } else {
        if (Math.abs(dy) > 20) sendDirection(dy > 0 ? 2 : 1);
      }
    }, { passive: true });

    function gameTick() {
      updateGame();

      const score = getScore();
      const over = isGameOver();
      scoreEl.innerText = String(score).padStart(4, '0');

      if (over) {
        msgEl.innerText = "DEAD! [5]";
      }

      // Draw Retro Monochrome Pixels
      ctx.fillStyle = "#97b538"; // LCD Green
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // LCD Border Line
      ctx.strokeStyle = "#162607";
      ctx.lineWidth = 3;
      ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);

      // Draw Pixelated Fruit (Dotted Square)
      const fx = getFruitX() * CELL_SIZE;
      const fy = getFruitY() * CELL_SIZE;
      ctx.fillStyle = "#162607";
      ctx.fillRect(fx + 4, fy + 4, CELL_SIZE - 8, CELL_SIZE - 8);
      ctx.clearRect(fx + 7, fy + 7, CELL_SIZE - 14, CELL_SIZE - 14);

      // Draw Snake Body
      const bodyLen = getBodyLength();
      for (let i = 0; i < bodyLen; ++i) {
        const bx = getBodyX(i) * CELL_SIZE;
        const by = getBodyY(i) * CELL_SIZE;
        ctx.fillStyle = "#162607";
        ctx.fillRect(bx + 1, by + 1, CELL_SIZE - 2, CELL_SIZE - 2);
      }

      // Draw Snake Head (Solid chunky pixel block with eyes)
      const hx = getHeadX() * CELL_SIZE;
      const hy = getHeadY() * CELL_SIZE;
      ctx.fillStyle = "#162607";
      ctx.fillRect(hx, hy, CELL_SIZE, CELL_SIZE);
      ctx.fillStyle = "#97b538"; // Eye cutout
      ctx.fillRect(hx + 4, hy + 4, 3, 3);
      ctx.fillRect(hx + 13, hy + 4, 3, 3);
    }
  </script>
</body>
</html>
